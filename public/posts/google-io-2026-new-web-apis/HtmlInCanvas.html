<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; display: flex; gap: 16px; padding: 16px; font-family: sans-serif; background: #0f172a; color: white; }
    #source { background: #1e293b; padding: 16px; border-radius: 8px; width: 200px; }
    canvas { border: 1px solid #334155; border-radius: 8px; }
    input { background: #334155; border: none; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
    label { display: block; margin-bottom: 8px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="source">
    <label>DOM element (normally inaccessible in canvas)</label>
    <input id="myInput" type="text" value="Edit me!" />
  </div>
  <canvas id="canvas" width="300" height="150"></canvas>
  <script type="module" src="index.ts"></script>
</body>
</html>
