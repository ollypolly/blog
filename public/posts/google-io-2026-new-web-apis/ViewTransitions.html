<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f8fafc; }
    .lists { display: flex; gap: 24px; }
    .list-container { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; width: 180px; }
    .item {
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
    }
    button { margin-top: 16px; padding: 8px 16px; border: none; background: #6366f1; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #4f46e5; }
    p { color: #94a3b8; font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="lists">
    <div>
      <div class="list-container" id="list-a"></div>
      <button onclick="shuffleA()">Shuffle A</button>
    </div>
    <div>
      <div class="list-container" id="list-b"></div>
      <button onclick="shuffleB()">Shuffle B</button>
    </div>
  </div>
  <p>Shuffle both at once — they animate independently.</p>
  <script type="module" src="index.ts"></script>
</body>
</html>
